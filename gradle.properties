# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.0
group=com.leonimust.applecraft
java_version=25

# Common
minecraft_version=26.3
mod_name=AppleCraft
mod_author=LeonimusTTV
mod_id=applecraft
license=PolyForm-Noncommercial-1.0.0
credits=
description=Apple Music in Minecraft: play, search and control your music without leaving the game.
minecraft_version_range=[26.1,27)
fabric_minecraft_range=>=26.1 <27
supported_versions=26.1,26.2,26.3
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.165.2+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.101
neoforge_loader_version_range=[4,)
neoforge_version_range=[26.1,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Publishing (see "Releasing" in README.md)
