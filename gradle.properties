# Shared by every build. Per-version values live in versions/<mc>-<loader>/gradle.properties.

# Project
version=0.1.0
group=com.leonimust.applecraft
mod_id=applecraft
mod_name=AppleCraft
mod_author=LeonimusTTV
license=PolyForm-Noncommercial-1.0.0
credits=
description=Apple Music in Minecraft: play, search and control your music without leaving the game.

# Loaders (shared by every Minecraft version)
fabric_loader_version=0.19.5
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Publishing (see "Releasing" in README.md)
## Default Worker URL baked into the jar. Release builds override it with -Pworker_url (GitHub variable WORKER_URL).
worker_url=http://localhost:8787
## Project IDs, from the project pages (Modrinth: "Copy ID" in the ⋯ menu, CurseForge: "Project ID" on the right)
modrinth_id=vsbG6rht
curseforge_id=applecraft-apple-music
