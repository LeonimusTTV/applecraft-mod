plugins {
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    id 'net.fabricmc.fabric-loom' version '1.18.1' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.147' apply false
    // Publishes to Modrinth and CurseForge: https://modmuss50.github.io/mod-publish-plugin/
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

// ---------------------------------------------------------------------------------------------------------------
// Publishing. Run by .github/workflows/publish.yml when a GitHub release is published.
// Locally: DRY_RUN=true ./gradlew build publishMods   (checks the whole setup without uploading anything)
// ---------------------------------------------------------------------------------------------------------------
def releaseType = System.getenv('RELEASE_TYPE') ?: 'stable'   // stable | beta | alpha

def mcVersions = supported_versions.split(',')*.trim()
def mcLabel = mcVersions.size() > 1 ? "${mcVersions.first()}-${mcVersions.last()}" : mcVersions.first()

publishMods {
    changelog = providers.environmentVariable('CHANGELOG').orElse('See the GitHub release for details.')
    type = releaseType == 'beta' ? BETA : releaseType == 'alpha' ? ALPHA : STABLE
    dryRun = System.getenv('DRY_RUN') == 'true'

    def cf = curseforgeOptions {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = curseforge_id ?: 'unset'
        minecraftVersions.addAll(mcVersions)
        javaVersions.add(JavaVersion.toVersion(java_version))
        client = true    // client-side mod: not needed on servers
        server = false
    }

    def mr = modrinthOptions {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = modrinth_id ?: 'unset'
        minecraftVersions.addAll(mcVersions)
        environment = CLIENT_ONLY
        // Keeps the Modrinth page in sync with MODRINTH.md on every release
        projectDescription = providers.fileContents(layout.projectDirectory.file('MODRINTH.md')).asText
    }

    curseforge('curseforgeFabric') {
        from cf
        file project(':fabric')
        modLoaders.add('fabric')
        displayName = "[${mcLabel}] AppleCraft Fabric ${project.version}".toString()
        requires('fabric-api')
    }
    curseforge('curseforgeNeoForge') {
        from cf
        file project(':neoforge')
        modLoaders.add('neoforge')
        displayName = "[${mcLabel}] AppleCraft NeoForge ${project.version}".toString()
    }

    modrinth('modrinthFabric') {
        from mr
        file project(':fabric')
        modLoaders.add('fabric')
        version = "${project.version}+${mcLabel}-fabric".toString()
        displayName = "AppleCraft ${project.version} (Fabric ${mcLabel})".toString()
        requires('fabric-api')
    }
    modrinth('modrinthNeoForge') {
        from mr
        file project(':neoforge')
        modLoaders.add('neoforge')
        version = "${project.version}+${mcLabel}-neoforge".toString()
        displayName = "AppleCraft ${project.version} (NeoForge ${mcLabel})".toString()
    }
}

// Safety checks, run before ANY upload task starts (a doFirst on publishMods would run after the uploads)
gradle.taskGraph.whenReady { graph ->
    if (!graph.allTasks.any { it.name.startsWith('publish') && it.project == rootProject }) return
    if (publishMods.dryRun.get()) return
    if (!modrinth_id || !curseforge_id) {
        throw new GradleException('Set modrinth_id and curseforge_id in gradle.properties before publishing.')
    }
    def worker = (project.findProperty('worker_url') ?: '').toString()
    if (!worker.startsWith('https://')) {
        throw new GradleException("Refusing to publish with worker_url='${worker}'. Pass -Pworker_url=https://… (GitHub variable WORKER_URL).")
    }
}
