# Builds AppleCraft and publishes it to Modrinth and CurseForge.
#
#  - Publishing a GitHub release (tag v1.2.3)  → real upload. Pre-releases are uploaded as BETA.
#  - "Run workflow" (manual)                    → dry run by default: builds and checks everything, uploads nothing.
#
# Setup (once), in the repo settings → Secrets and variables → Actions:
#   secrets:   MODRINTH_TOKEN, CURSEFORGE_TOKEN
#   variables: WORKER_URL   (deployed Worker, e.g. https://applecraft-token.<you>.workers.dev)
# and fill modrinth_id / curseforge_id in gradle.properties.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and validate, but don't upload)"
        type: boolean
        default: true

permissions:
  contents: write   # to attach the jars to the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Java 25 builds the mod; NeoForge's tooling (asset download) also needs Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            DRY_RUN=false
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then TYPE=beta; else TYPE=stable; fi
          else
            VERSION="$(grep -E '^version=' gradle.properties | cut -d= -f2)-dev.${GITHUB_RUN_NUMBER}"
            DRY_RUN="${{ inputs.dry_run }}"
            TYPE=alpha
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Publishing AppleCraft $VERSION (type=$TYPE, dry_run=$DRY_RUN)"

      - name: Check Worker URL
        if: steps.v.outputs.dry_run == 'false'
        run: |
          if [[ "${{ vars.WORKER_URL }}" != https://* ]]; then
            echo "::error::Set the WORKER_URL repository variable to your deployed Worker (https://…)."
            exit 1
          fi

      - name: Build and publish
        run: >
          ./gradlew build publishMods --stacktrace -Pneoforge_skip_decompile=true
          -Pversion=${{ steps.v.outputs.version }}
          -Pworker_url=${{ vars.WORKER_URL || 'http://localhost:8787' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ github.event.release.body }}
          RELEASE_TYPE: ${{ steps.v.outputs.type }}
          DRY_RUN: ${{ steps.v.outputs.dry_run }}

      - name: Attach jars to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release upload "$GITHUB_REF_NAME" \
            versions/*/build/libs/applecraft-*-"$V".jar \
            --clobber

      - name: Keep the jars (dry runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: applecraft-${{ steps.v.outputs.version }}
          path: |
            versions/*/build/libs/*.jar
